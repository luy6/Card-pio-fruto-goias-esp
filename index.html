<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frutos Goiás — Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --roxo-escuro:#1B4D2E;
    --roxo-vivo:#2E7D4F;
    --pink:#E85D9E;
    --creme:#FFF8ED;
    --verde:#7FB069;
    --mel:#F4A93B;
    --texto-claro:#FFF8ED;
    --texto-escuro:#1B4D2E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--creme);
    color:var(--texto-escuro);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Unbounded',sans-serif;}
  .mono{font-family:'Space Mono',monospace;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    background:radial-gradient(circle at 30% 20%, var(--roxo-vivo), var(--roxo-escuro) 65%);
    color:var(--texto-claro);
    padding:70px 24px 110px;
    text-align:center;
    overflow:hidden;
  }
  .hero::before, .hero::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    animation:flutuar 7s ease-in-out infinite;
  }
  .hero::before{
    width:220px;height:220px;
    background:var(--pink);
    opacity:.25;
    top:-60px; left:-60px;
  }
  .hero::after{
    width:160px;height:160px;
    background:var(--mel);
    opacity:.2;
    bottom:-40px; right:-30px;
    animation-delay:1.5s;
  }
  @keyframes flutuar{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-14px);}
  }
  .eyebrow{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:.7rem;
    letter-spacing:.15em;
    text-transform:uppercase;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:22px;
  }
  .hero h1{
    font-size:2.6rem;
    font-weight:800;
    line-height:1.05;
    margin-bottom:14px;
    position:relative;
    z-index:2;
  }
  .hero h1 span{color:var(--mel);}
  .hero p{
    max-width:420px;
    margin:0 auto;
    opacity:.85;
    font-size:.98rem;
    position:relative;
    z-index:2;
  }

  /* bowl graphic */
  .bowl-wrap{
    position:relative;
    width:190px;height:190px;
    margin:34px auto 0;
    z-index:2;
  }
  .bowl{
    position:absolute; inset:0;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, #3d8a5f, #12331f 70%);
    box-shadow: inset 0 -14px 24px rgba(0,0,0,.4), 0 18px 30px rgba(0,0,0,.35);
  }
  .topping{
    position:absolute;
    border-radius:50%;
  }
  .t1{width:26px;height:16px;background:#F4A93B;top:28%;left:22%;transform:rotate(-15deg);border-radius:50%;}
  .t2{width:20px;height:20px;background:#E85D9E;top:38%;right:20%;}
  .t3{width:34px;height:12px;background:#7FB069;bottom:30%;left:30%;border-radius:8px;transform:rotate(10deg);}
  .t4{width:16px;height:16px;background:#FFF8ED;top:22%;right:34%;opacity:.9;}

  /* ---------- NAV categorias ---------- */
  .cat-nav{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:16px 20px;
    background:rgba(255,248,237,.75);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 1px 0 rgba(27,77,46,.08), 0 8px 24px -12px rgba(27,77,46,.15);
    scrollbar-width:none;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-btn{
    flex:0 0 auto;
    font-family:'Unbounded',sans-serif;
    font-size:.76rem;
    font-weight:600;
    padding:10px 18px;
    border-radius:999px;
    border:1.5px solid rgba(27,77,46,.18);
    background:#fff;
    color:var(--roxo-escuro);
    cursor:pointer;
    white-space:nowrap;
    transition:.2s ease;
    box-shadow:0 1px 2px rgba(27,77,46,.06);
  }
  .cat-btn.active, .cat-btn:hover{
    background:linear-gradient(135deg, var(--roxo-vivo), var(--roxo-escuro));
    border-color:transparent;
    color:var(--creme);
    box-shadow:0 6px 16px -4px rgba(27,77,46,.45);
    transform:translateY(-1px);
  }

  /* ---------- SEÇÕES / CARDS ---------- */
  main{max-width:720px;margin:0 auto;padding:36px 20px 80px;}
  .section{margin-bottom:52px;}
  .section-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:16px;
    padding-bottom:0;
  }
  .section-head h2{
    font-size:1.4rem;
    color:var(--roxo-escuro);
    position:relative;
    padding-bottom:8px;
  }
  .section-head h2::after{
    content:"";
    position:absolute;
    left:0; bottom:0;
    width:36px; height:4px;
    border-radius:4px;
    background:linear-gradient(90deg, var(--roxo-vivo), var(--mel));
  }
  .section-head small{font-family:'Space Mono',monospace;font-size:.72rem;opacity:.5;}

  .item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    padding:16px 16px;
    margin-bottom:10px;
    background:#fff;
    border:1.5px solid rgba(27,77,46,.08);
    border-radius:16px;
    box-shadow:0 2px 8px -4px rgba(27,77,46,.1);
    opacity:0;
    transform:translateY(14px);
    animation:rise .5s ease forwards;
    cursor:pointer;
    transition:box-shadow .18s ease, border-color .18s ease, transform .18s ease, background .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .item:hover{
    box-shadow:0 8px 20px -6px rgba(27,77,46,.2);
    transform:translateY(-2px);
  }
  .item:active{transform:scale(.985);}
  .item.selecionado{
    background:linear-gradient(135deg, rgba(46,125,79,.08), rgba(244,169,59,.06));
    border-color:var(--roxo-vivo);
    box-shadow:0 8px 22px -8px rgba(46,125,79,.35);
  }
  @keyframes rise{to{opacity:1;transform:none;}}
  .item-info{display:flex; align-items:flex-start; gap:12px;}
  .item-check{
    flex:0 0 auto;
    width:24px;height:24px;
    border-radius:50%;
    border:2px solid rgba(27,77,46,.3);
    margin-top:2px;
    display:flex;align-items:center;justify-content:center;
    font-size:.75rem;
    color:var(--creme);
    transition:background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .item.selecionado .item-check{
    background:var(--roxo-vivo);
    border-color:var(--roxo-vivo);
    transform:scale(1.08);
  }
  .item-texts h3{
    font-size:1.02rem;
    font-weight:600;
    color:var(--texto-escuro);
    margin-bottom:4px;
  }
  .item-texts p{font-size:.83rem;opacity:.65;max-width:380px;line-height:1.4;}
  .item-foto{
    flex:0 0 auto;
    width:56px;height:56px;
    border-radius:12px;
    object-fit:cover;
    background:rgba(27,77,46,.06);
  }
  .item-foto-vazia{
    display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;
    border:1.5px dashed rgba(27,77,46,.25);
    color:rgba(27,77,46,.4);
    cursor:pointer;
  }
  .item-foto.editavel{cursor:pointer;}
  .item-foto.zoomavel{cursor:zoom-in;}
  .lightbox{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,.85);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:24px;
    animation:lightboxFade .18s ease-out;
  }
  .lightbox.aberta{display:flex;}
  @keyframes lightboxFade{from{opacity:0;}to{opacity:1;}}
  .lightbox img{
    max-width:100%;
    max-height:85vh;
    border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  .lightbox-fechar{
    position:absolute;
    top:18px;right:18px;
    width:40px;height:40px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:#fff;
    border:1px solid rgba(255,255,255,.3);
    font-size:1.3rem;
    line-height:1;
    cursor:pointer;
  }
  .cobertura-foto{
    width:100%;
    max-height:180px;
    object-fit:cover;
    border-radius:14px;
    margin-bottom:14px;
  }
  .item-right{display:flex;align-items:center;gap:10px;white-space:nowrap;}
  .item-price{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:1rem;
    color:var(--roxo-vivo);
  }
  .qty-controls{
    display:flex;
    align-items:center;
    gap:10px;
    background:linear-gradient(135deg, var(--roxo-vivo), var(--roxo-escuro));
    border-radius:999px;
    padding:5px 10px;
    box-shadow:0 3px 10px -3px rgba(27,77,46,.5);
  }
  .qty-controls button{
    background:rgba(255,255,255,.15);
    border:none;
    color:var(--creme);
    font-size:1rem;
    font-weight:700;
    width:22px;height:22px;
    border-radius:50%;
    cursor:pointer;
    line-height:1;
    transition:background .15s ease;
  }
  .qty-controls button:hover{background:rgba(255,255,255,.3);}
  .qty-controls span{
    font-family:'Space Mono',monospace;
    color:var(--creme);
    font-size:.85rem;
    min-width:14px;
    text-align:center;
  }

  .empty-state{
    text-align:center;
    padding:40px 20px;
    border:2px dashed rgba(45,10,49,.25);
    border-radius:16px;
    color:rgba(45,10,49,.55);
    font-size:.9rem;
  }

  footer{
    text-align:center;
    padding:30px 20px 130px;
    font-size:.78rem;
    color:rgba(45,10,49,.5);
    font-family:'Space Mono',monospace;
  }

  /* ---------- CARRINHO / WHATSAPP ---------- */
  .cart-bar{
    position:fixed;
    left:16px; right:16px; bottom:16px;
    max-width:688px;
    margin:0 auto;
    background:linear-gradient(135deg, rgba(27,77,46,.92), rgba(46,125,79,.92));
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    color:var(--creme);
    border-radius:20px;
    padding:14px 16px 14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    box-shadow:0 16px 40px -10px rgba(27,77,46,.5), inset 0 1px 0 rgba(255,255,255,.1);
    transform:translateY(140%);
    transition:transform .3s cubic-bezier(.2,.9,.3,1.1);
    z-index:20;
  }
  .cart-bar.mostrar{transform:translateY(0);}
  .cart-info{display:flex;flex-direction:column;gap:2px;}
  .cart-info .qtd{font-family:'Space Mono',monospace;font-size:.7rem;opacity:.7;}
  .cart-info .total{font-family:'Unbounded',sans-serif;font-weight:700;font-size:1.15rem;}
  .cart-send{
    display:flex;
    align-items:center;
    gap:8px;
    background:#25D366;
    color:#0b1f13;
    border:none;
    font-family:'Unbounded',sans-serif;
    font-weight:600;
    font-size:.82rem;
    padding:13px 20px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 6px 16px -4px rgba(37,211,102,.6);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cart-send:hover{transform:scale(1.05); box-shadow:0 8px 20px -4px rgba(37,211,102,.7);}
  .cart-send:active{transform:scale(.97);}
  .cart-send svg{width:16px;height:16px;flex:0 0 auto;}

  /* ---------- CHECKOUT / ENTREGA ---------- */
  .checkout-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,40,25,.68);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:30;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .checkout-overlay.aberto{opacity:1;pointer-events:auto;}
  .checkout-modal{
    background:linear-gradient(165deg, #1c4a2e, #0d2417);
    color:var(--creme);
    width:100%;
    max-width:520px;
    max-height:88vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    border-radius:28px 28px 0 0;
    padding:10px 22px 28px;
    box-shadow:0 -20px 60px -20px rgba(0,0,0,.45);
    transform:translateY(40px) translateZ(0);
    transition:transform .3s cubic-bezier(.2,.9,.3,1.1);
  }
  .checkout-overlay.aberto .checkout-modal{transform:translateY(0) translateZ(0);}
  .checkout-modal::before{
    content:"";
    display:block;
    width:40px; height:4px;
    border-radius:4px;
    background:rgba(255,248,237,.3);
    margin:8px auto 16px;
  }
  .checkout-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .checkout-head h2{font-size:1.3rem;color:var(--creme);}
  .checkout-close{
    background:rgba(255,255,255,.14);
    border:none;
    width:34px;height:34px;
    border-radius:50%;
    font-size:1rem;
    color:var(--creme);
    cursor:pointer;
    transition:background .15s ease;
  }
  .checkout-close:hover{background:rgba(255,255,255,.22);}
  .admin-modal .checkout-close, .cobertura-modal .checkout-close{
    background:rgba(27,77,46,.08);
    color:var(--roxo-escuro);
  }
  .admin-modal .checkout-close:hover, .cobertura-modal .checkout-close:hover{background:rgba(27,77,46,.16);}
  .campo{margin-bottom:16px;}
  .campo label{
    display:block;
    font-size:.76rem;
    font-weight:700;
    color:var(--mel);
    opacity:1;
    margin-bottom:7px;
    font-family:'Space Mono',monospace;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .campo input, .campo select, .campo textarea{
    width:100%;
    padding:13px 15px;
    border-radius:14px;
    border:1.5px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.08);
    box-shadow:none;
    font-family:'Inter',sans-serif;
    font-size:.95rem;
    color:var(--creme);
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .campo input::placeholder, .campo textarea::placeholder{color:rgba(255,248,237,.45);}
  .campo select option{color:#000;}
  .campo input:focus, .campo select:focus, .campo textarea:focus{
    outline:none;
    border-color:var(--mel);
    background:rgba(255,255,255,.13);
    box-shadow:0 0 0 4px rgba(244,169,59,.18);
  }
  .campo textarea{resize:vertical; min-height:60px;}
  .opcoes-toggle{display:flex; gap:10px; background:rgba(0,0,0,.2); padding:5px; border-radius:16px;}
  .opcao-btn{
    flex:1;
    padding:11px 10px;
    border-radius:12px;
    border:none;
    background:transparent;
    font-family:'Unbounded',sans-serif;
    font-size:.8rem;
    font-weight:600;
    color:rgba(255,248,237,.75);
    cursor:pointer;
    transition:.18s ease;
  }
  .opcao-btn.ativa{
    background:var(--mel);
    color:#3a2400;
    box-shadow:0 3px 12px -3px rgba(244,169,59,.5);
  }
  #checkoutItens{display:flex; flex-direction:column; gap:10px;}
  .checkout-item{
    background:rgba(255,255,255,.07);
    border:1.5px solid rgba(255,255,255,.12);
    border-radius:16px;
    padding:12px 14px;
    box-shadow:none;
  }
  .checkout-item-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
  }
  .checkout-item-top .nome{
    font-family:'Unbounded',sans-serif;
    font-size:.85rem;
    font-weight:600;
    color:var(--creme);
  }
  .checkout-item-top .preco{
    font-family:'Space Mono',monospace;
    font-size:.82rem;
    color:var(--mel);
    white-space:nowrap;
  }
  .checkout-item input{
    width:100%;
    padding:9px 12px;
    border-radius:10px;
    border:1.5px solid rgba(255,255,255,.14);
    background:rgba(0,0,0,.18);
    font-family:'Inter',sans-serif;
    font-size:.85rem;
    color:var(--creme);
    transition:border-color .15s ease;
  }
  .checkout-item input:focus{outline:none; border-color:var(--mel);}
  .checkout-item input::placeholder{color:rgba(255,248,237,.4);}
  #blocoEndereco.escondido{display:none;}
  #campoTroco.escondido{display:none;}
  .checkout-resumo{
    padding:14px 16px;
    background:rgba(0,0,0,.2);
    border-radius:14px;
    margin:6px 0 16px;
  }
  .checkout-resumo-linhas{display:flex; flex-direction:column; gap:6px;}
  .linha-resumo{
    display:flex;
    justify-content:space-between;
    font-family:'Inter',sans-serif;
    font-size:.85rem;
    color:var(--creme);
    opacity:.75;
  }
  .linha-resumo.total{
    font-family:'Unbounded',sans-serif;
    font-weight:700;
    font-size:1.15rem;
    color:var(--mel);
    opacity:1;
    padding-top:8px;
    margin-top:2px;
    border-top:1.5px dashed rgba(255,255,255,.2);
  }
  #linhaTaxaEntrega.escondida{display:none;}

  .taxa-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#fff;
    border:1.5px solid rgba(27,77,46,.08);
    border-radius:14px;
    padding:10px 14px;
    margin-bottom:8px;
  }
  .taxa-row .taxa-nome{font-family:'Unbounded',sans-serif; font-size:.85rem; font-weight:600; color:var(--roxo-escuro);}
  .taxa-row .taxa-valor{font-family:'Space Mono',monospace; font-size:.82rem; color:var(--roxo-vivo);}
  .taxa-row .taxa-botoes{display:flex; gap:6px;}

  /* ---------- PERSONALIZAR ITEM COM COBERTURAS ---------- */
  .cobertura-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,40,25,.55);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:32;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .cobertura-overlay.aberto{opacity:1; pointer-events:auto;}
  .cobertura-modal{
    background:var(--creme);
    color:var(--texto-escuro);
    width:100%;
    max-width:480px;
    max-height:85vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    border-radius:28px 28px 0 0;
    padding:10px 22px 26px;
    box-shadow:0 -20px 60px -20px rgba(0,0,0,.35);
    transform:translateY(40px) translateZ(0);
    transition:transform .3s cubic-bezier(.2,.9,.3,1.1);
  }
  .cobertura-overlay.aberto .cobertura-modal{transform:translateY(0) translateZ(0);}
  .cobertura-modal::before{
    content:"";
    display:block;
    width:40px; height:4px;
    border-radius:4px;
    background:rgba(27,77,46,.18);
    margin:8px auto 16px;
  }
  .cobertura-modal .checkout-head h2{color:var(--roxo-escuro);}
  .cobertura-preco-base{
    font-family:'Space Mono',monospace;
    color:var(--roxo-vivo);
    font-size:.85rem;
    margin:-8px 0 18px;
  }
  #listaCoberturas .empty-state{padding:24px 12px;}
  .cobertura-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px 2px;
    border-bottom:1px dashed rgba(27,77,46,.15);
    cursor:pointer;
  }
  .cobertura-item:last-child{border-bottom:none;}
  .cobertura-item .nome{font-size:.92rem; color:var(--texto-escuro); font-weight:500;}
  .cobertura-item .preco{font-family:'Space Mono',monospace; font-size:.8rem; color:var(--roxo-vivo); opacity:.85; white-space:nowrap;}
  .cobertura-check{
    width:22px; height:22px;
    border-radius:7px;
    border:2px solid rgba(27,77,46,.3);
    display:flex; align-items:center; justify-content:center;
    font-size:.75rem; color:#fff;
    transition:background .15s ease, border-color .15s ease;
    flex:0 0 auto;
  }
  .cobertura-item.selecionada .cobertura-check{background:var(--roxo-vivo); border-color:var(--roxo-vivo);}
  .cobertura-qtd-linha{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:18px 0 6px;
  }
  .cobertura-qtd-linha span:first-child{
    font-family:'Unbounded',sans-serif;
    font-size:.85rem;
    color:var(--roxo-escuro);
    font-weight:600;
  }
  .cobertura-total-linha{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(46,125,79,.08);
    border-radius:14px;
